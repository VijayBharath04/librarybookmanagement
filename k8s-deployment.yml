apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-app-deployment
  labels:
    app: library-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library-app
  template:
    metadata:
      labels:
        app: library-app
    spec:
      containers:
      - name: library-app
        image: vijaybharathg0405/library-app:IMAGE_TAG
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: library-app-service
spec:
  type: NodePort
  selector:
    app: library-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080