name: Kubernetes Library App CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    # Stage 1 & 2: Source Code & Version Control
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Stage 3: Continuous Integration (Install & Test)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest test_app.py

    # Stage 4: Build & Push Docker Image (Using Git SHA as a Unique Tag)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/library-app:${{ github.sha }}

    # Stage 5: Deployment (Prepare manifests)
    - name: Update Kubernetes Manifest with Unique Tag
      run: |
        sed -i 's/IMAGE_TAG/${{ github.sha }}/g' k8s-deployment.yml

    # This step validates the compiled deployment manifest structure
    - name: Dry-run Deployment Verification
      run: |
        echo "Manifest successfully generated with tag: ${{ github.sha }}"
        cat k8s-deployment.yml